[project]
name = "rec-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.13",
  "grpcio>=1.78",
  "SQLAlchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3.5",
  "scpedia-protos @ file:../../libs/scpedia_protos",
  "aio_pika>=9.6",
  "numpy>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.3",
  "pytest-mock>=3.15",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
rec-service = "rec_service.main:run"
rec-refresh-worker = "rec_service.pool.refresh_worker:run"
rec-gc-worker = "rec_service.pool.gc_worker:run"